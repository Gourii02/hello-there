services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: hello_there
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DOCKER_POSTGRES_PASSWORD:-hello_there_dev_only}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hello_there"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command:
      - sh
      - -c
      - npm run db:migrate --workspace backend && exec npm run dev --workspace backend
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://postgres:${DOCKER_POSTGRES_PASSWORD:-hello_there_dev_only}@database:5432/hello_there
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "3002:3001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command:
      - npm
      - run
      - dev
      - --workspace
      - frontend
      - --
      - --host
      - 0.0.0.0
    environment:
      VITE_API_TARGET: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5175:5173"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data: