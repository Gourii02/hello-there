name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hello_there_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hello_there_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hello_there_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:integration
      - run: npm run lint
      - run: npm run build
      - name: Build and start Docker Compose stack
        run: docker compose up --build --detach --wait
      - name: Smoke-test containerized application
        run: |
          curl --retry 10 --retry-connrefused --retry-delay 2 --fail --silent --show-error http://localhost:5175/ > /dev/null
          curl --fail --silent --show-error http://localhost:5175/api/health
          greeting=$(curl --fail --silent --show-error --request POST --header 'Content-Type: application/json' --data '{"name":"CI"}' http://localhost:5175/api/greet)
          echo "$greeting" | grep -Fq '"greeting":"Hello, CI!"'
          stats=$(curl --fail --silent --show-error http://localhost:5175/api/stats)
          echo "$stats" | grep -Fq '"totalGreetings":1'
      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down --volumes
